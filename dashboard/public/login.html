<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stela Studio — Đăng nhập</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--accent:#7c3aed;--accent2:#3b82f6;--green:#10b981;--red:#ef4444;--gold:#fbbf24;--font:'Outfit',sans-serif;--mono:'JetBrains Mono',monospace}
[data-theme="dark"]{--bg:#0a0b0f;--surface:#13151e;--border:#1e2235;--text:#e2e8f7;--text2:#8892b0;--muted:#4a5580}
[data-theme="light"]{--bg:#f0f2f9;--surface:#ffffff;--border:#d8ddf0;--text:#1a1d2e;--text2:#5a6280;--muted:#a0a8c0}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:background .3s}
.bg-grid{position:fixed;inset:0;background-image:linear-gradient(rgba(124,58,237,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(124,58,237,.04) 1px,transparent 1px);background-size:48px 48px;animation:gridScroll 25s linear infinite;pointer-events:none}
@keyframes gridScroll{from{transform:translateY(0)}to{transform:translateY(48px)}}
.orb{position:fixed;border-radius:50%;filter:blur(100px);pointer-events:none}
.orb1{width:500px;height:500px;background:rgba(124,58,237,.12);top:-150px;left:-150px;animation:pulse 8s ease-in-out infinite}
.orb2{width:400px;height:400px;background:rgba(59,130,246,.10);bottom:-100px;right:-100px;animation:pulse 8s ease-in-out infinite;animation-delay:-4s}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.15);opacity:1}}
.box{position:relative;z-index:10;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:40px;width:400px;box-shadow:0 0 80px rgba(124,58,237,.12),0 30px 60px rgba(0,0,0,.4);animation:slideUp .5s cubic-bezier(.16,1,.3,1)}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.logo{text-align:center;margin-bottom:28px}
.logo-icon{width:60px;height:60px;background:linear-gradient(135deg,#7c3aed,#3b82f6);border-radius:16px;display:inline-flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:14px;box-shadow:0 0 32px rgba(124,58,237,.45)}
.logo h1{font-size:20px;font-weight:800;letter-spacing:-.3px}
.logo p{font-size:11px;color:var(--muted);margin-top:4px;font-family:var(--mono)}
.info{background:rgba(124,58,237,.07);border:1px solid rgba(124,58,237,.2);border-radius:10px;padding:12px 14px;margin-bottom:22px}
.info-title{font-size:12px;font-weight:700;margin-bottom:8px}
.roles{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700}
.chip.owner{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);color:var(--gold)}
.chip.admin{background:rgba(124,58,237,.1);border:1px solid rgba(124,58,237,.3);color:#a78bfa}
.chip.mod{background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.3);color:#93c5fd}
label{display:block;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text2);margin-bottom:6px}
.field{position:relative;margin-bottom:14px}
.field-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;pointer-events:none}
input{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:10px;padding:11px 12px 11px 36px;color:var(--text);font-size:14px;font-family:var(--mono);outline:none;transition:all .2s}
input:focus{border-color:#7c3aed;box-shadow:0 0 0 3px rgba(124,58,237,.18)}
input::placeholder{color:var(--muted)}
.err{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.3);border-radius:9px;padding:10px 13px;font-size:13px;color:var(--red);margin-bottom:13px;display:none;line-height:1.5}
.btn{width:100%;background:linear-gradient(135deg,#7c3aed,#3b82f6);border:none;border-radius:10px;padding:13px;color:#fff;font-size:15px;font-weight:700;font-family:var(--font);cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.btn:hover{opacity:.93;transform:translateY(-1px);box-shadow:0 6px 20px rgba(124,58,237,.35)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.ver{text-align:center;margin-top:18px;font-size:11px;color:var(--muted);font-family:var(--mono)}
.theme-toggle{position:fixed;top:16px;right:16px;z-index:100;width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;opacity:.7}
.theme-toggle:hover{opacity:1}
.spin{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<button class="theme-toggle" id="themeBtn" title="Đổi theme">🌙</button>

<div class="box">
  <div class="logo">
    <div class="logo-icon">⭐</div>
    <h1>Stela Studio</h1>
    <p>BOT DASHBOARD v5.0.0</p>
  </div>
  <div class="info">
    <div class="info-title">🔐 Chỉ dành cho người được cấp quyền</div>
    <div class="roles">
      <span class="chip owner">👑 Owner</span>
      <span class="chip admin">🛡️ Admin</span>
      <span class="chip mod">🔰 Mod</span>
    </div>
  </div>
  <label>Discord User ID</label>
  <div class="field">
    <span class="field-icon">🪪</span>
    <input type="text" id="userId" placeholder="123456789012345678" inputmode="numeric" autofocus>
  </div>
  <label>Mật khẩu Dashboard</label>
  <div class="field">
    <span class="field-icon">🔑</span>
    <input type="password" id="pass" placeholder="Nhập mật khẩu...">
  </div>
  <div class="err" id="err"></div>
  <button class="btn" id="loginBtn" onclick="login()">🔓 Đăng nhập</button>
  <div class="ver">Stela Studio Bot · by atk_meow</div>
</div>

<script>
const theme=localStorage.getItem('stelaDashTheme')||'dark';
document.documentElement.dataset.theme=theme;
document.getElementById('themeBtn').textContent=theme==='dark'?'🌙':'☀️';
document.getElementById('themeBtn').onclick=()=>{
  const t=document.documentElement.dataset.theme==='dark'?'light':'dark';
  document.documentElement.dataset.theme=t;
  localStorage.setItem('stelaDashTheme',t);
  document.getElementById('themeBtn').textContent=t==='dark'?'🌙':'☀️';
};
document.addEventListener('keydown',e=>{ if(e.key==='Enter') login(); });
async function login(){
  const userId=document.getElementById('userId').value.trim();
  const pass=document.getElementById('pass').value;
  const btn=document.getElementById('loginBtn');
  const err=document.getElementById('err');
  err.style.display='none';
  if (!userId){showErr('Nhập Discord User ID!');return;}
  if (!/^\d{17,20}$/.test(userId)){showErr('Discord User ID phải là 17-20 chữ số!');return;}
  if (!pass){showErr('Nhập mật khẩu dashboard!');return;}
  btn.innerHTML='<span class="spin">⏳</span> Đang đăng nhập...';
  btn.disabled=true;
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId,password:pass})});
    const d=await r.json();
    if(d.ok){btn.innerHTML=`✅ Chào ${d.roleLabel}!`;setTimeout(()=>location.href='/',500);}
    else{showErr(d.error||'Đăng nhập thất bại!');btn.innerHTML='🔓 Đăng nhập';btn.disabled=false;}
  }catch{showErr('Lỗi kết nối server!');btn.innerHTML='🔓 Đăng nhập';btn.disabled=false;}
}
function showErr(msg){const err=document.getElementById('err');err.innerHTML='❌ '+msg;err.style.display='block';}
</script>
</body>
</html>
