# ==============================================
# Ticket bot general settings
# ==============================================

# Vars:
# {root} - Base directory, same place as this file
dbPath: "{root}/data" 

# Role Admin và Staff có quyền Blacklist
rolesThatCanBlacklist: [ "1468288305287135470", "1445797855037227131", "1488884171110613092", "1488911239185961040", "1488174588289351730", "1445798700352802837"]
rolesOnBlacklist: [] 
blacklistCleanup: "120" 
transcriptType: "HTML" 
transcriptName: "{channelName}-transcript" 
transcriptImages: false 
reOpenStaffOnly: false 
closeStaffOnly: true 
deleteStaffOnly: true 
commands_cooldown: "5" 
buttons_cooldown: "5" 
maxOpenTickets: "1" 
preventNewTicket: false 
silentStartup: false 
deleteTicketTime: "5" 
claimFeature: true # Đã bật tính năng Claim để staff nhận đơn
claimRename: false 
claimRenameName: "{category}-{username}" 
claim1on1: false 
status:
  botActivityText: "Hỗ trợ Stela Network" 
  botActivityType: "Watching" 
  streamingOptionURL: "" 
  botStatus: "online" 
alertReply:
  enabled: false 
  time: "300" 
  autoAction: "none" 
autoCloseTickets:
  enabled: false 
  interval: "60" 
  time: "86400" 
  ignoreBots: false 
autoDeleteTickets:
  enabled: false 
  interval: "60" 
  time: "86400" 
onUserLeave: "close" 
addUsersBack: true 
statsChannels:
  enabled: false 
  interval: "600" 
  channels:
    - channelID: "111111111111111111" 
      type: "totalTickets" 
      name: "Total Tickets: {stats}" 
    - channelID: "111111111111111111"
      type: "openTickets"
      name: "Total Open Tickets: {stats}"
    - channelID: "111111111111111111"
      type: "ratings"
      name: "Average Rating: {stats}/5.0"

